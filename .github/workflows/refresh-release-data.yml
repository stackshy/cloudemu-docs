name: Refresh release data

# Re-generates the changelog + contributors data from the cloudemu product repo
# (GitHub Releases + contributors) and opens a PR to `development` when anything
# changed. Runs daily and can be triggered by hand right after a release.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate changelog + contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/import-changelog.mjs --repo stackshy/cloudemu
          node scripts/import-contributors.mjs --repo stackshy/cloudemu

      - name: Open PR if the data changed
        uses: peter-evans/create-pull-request@v6
        with:
          base: development
          branch: chore/refresh-release-data
          add-paths: |
            lib/changelog.generated.ts
            lib/contributors.generated.ts
          title: 'chore: refresh changelog + contributors from GitHub'
          commit-message: 'chore: refresh changelog + contributors from GitHub releases'
          author: Nitin Kumar <nitinraj844126@gmail.com>
          committer: Nitin Kumar <nitinraj844126@gmail.com>
          body: |
            Automated refresh of the release data from the cloudemu product repo.

            - `lib/changelog.generated.ts` — latest GitHub Releases
            - `lib/contributors.generated.ts` — latest contributors

            Merge to update the changelog + contributors page. Then promote
            `development` → `main` to publish.
          delete-branch: true
